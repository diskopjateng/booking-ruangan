<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Booking Ruang - DISKOP UKM JATENG</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bg-jateng { background-color: #1e3a8a; }
        .fc-event { cursor: pointer; padding: 2px 5px; font-size: 10px; font-weight: bold; border-radius: 4px; }
        .calendar-day { height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .calendar-day:hover { background: #e2e8f0; }
        .calendar-day.selected { background: #1e3a8a !important; color: white; }
        .time-picker-overlay { display: none; position: absolute; bottom: 100%; left: 0; width: 100%; background: white; border: 1px solid #ddd; border-radius: 1rem; z-index: 100; padding: 10px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .time-column { height: 150px; overflow-y: auto; scrollbar-width: none; }
        .time-unit { padding: 5px; text-align: center; cursor: pointer; border-radius: 5px; }
        .time-unit:hover { background: #f1f5f9; }
        .time-unit.active { background: #1e3a8a; color: white; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div id="app">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b-4 border-yellow-500">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Coat_of_arms_of_Central_Java.svg/960px-Coat_of_arms_of_Central_Java.svg.png" class="h-10">
                <h1 class="font-black text-blue-900 text-sm">DISKOP UKM JATENG</h1>
            </div>
            <div id="roleLabel" class="text-[10px] font-black bg-blue-100 text-blue-700 px-4 py-2 rounded-full uppercase">GUEST</div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-jateng text-white py-12 text-center">
        <h2 class="text-3xl font-black uppercase tracking-tighter">Room Booking System</h2>
        <p class="opacity-70 text-sm">Pastikan jadwal tidak bertabrakan sebelum mengajukan.</p>
    </header>

    <!-- Form Section -->
    <section id="userFormSection" class="container mx-auto px-6 -mt-8 hidden mb-10">
        <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <form id="bookingForm" onsubmit="simpanKeFirebase(event)" class="grid grid-cols-1 md:grid-cols-2">
                <!-- Kiri: Kalender Kecil -->
                <div class="p-6 bg-gray-50 border-r">
                    <label class="text-[10px] font-black text-gray-400 uppercase block mb-2">1. Pilih Tanggal</label>
                    <div class="bg-white p-4 rounded-xl shadow-inner">
                        <div class="flex justify-between items-center mb-2">
                            <button type="button" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                            <span id="monthName" class="font-bold text-sm uppercase"></span>
                            <button type="button" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        <div id="miniCalendar" class="grid grid-cols-7 gap-1 text-[10px] text-center"></div>
                    </div>
                    <input type="hidden" id="tanggal" required>
                </div>

                <!-- Kanan: Detail -->
                <div class="p-6 space-y-4">
                    <label class="text-[10px] font-black text-gray-400 uppercase block">2. Lengkapi Data</label>
                    <input type="text" id="kegiatan" placeholder="Nama Kegiatan" required class="w-full p-3 bg-gray-100 rounded-xl text-sm font-semibold outline-none focus:ring-2 ring-blue-500">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <select id="ruangan" class="p-3 bg-gray-100 rounded-xl text-xs font-bold uppercase">
                            <option>GATOTKACA</option>
                            <option>ARJUNA</option>
                            <option>ARIMBI</option>
                            <option>PODCAST</option>
                        </select>
                        <select id="bidang" class="p-3 bg-gray-100 rounded-xl text-xs font-bold uppercase">
                            <option>UMPEG</option>
                            <option>PROGRAM</option>
                            <option>KEUANGAN</option>
                            <option>BINA USAHA KOPERASI</option>
                            <option>UKM</option>
                            <option>BALATKOP</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="relative">
                            <input type="text" id="jamMulai" placeholder="Mulai" readonly onclick="togglePicker('pickerMulai')" class="w-full p-3 bg-gray-100 rounded-xl text-center text-xs font-bold cursor-pointer">
                            <div id="pickerMulai" class="time-picker-overlay">
                                <div class="flex">
                                    <div id="hMulai" class="time-column flex-1"></div>
                                    <div id="mMulai" class="time-column flex-1 border-l"></div>
                                </div>
                                <button type="button" onclick="togglePicker('pickerMulai')" class="w-full mt-2 bg-blue-900 text-white text-[10px] py-1 rounded">Set</button>
                            </div>
                        </div>
                        <div class="relative">
                            <input type="text" id="jamSelesai" placeholder="Selesai" readonly onclick="togglePicker('pickerSelesai')" class="w-full p-3 bg-gray-100 rounded-xl text-center text-xs font-bold cursor-pointer">
                            <div id="pickerSelesai" class="time-picker-overlay">
                                <div class="flex">
                                    <div id="hSelesai" class="time-column flex-1"></div>
                                    <div id="mSelesai" class="time-column flex-1 border-l"></div>
                                </div>
                                <button type="button" onclick="togglePicker('pickerSelesai')" class="w-full mt-2 bg-blue-900 text-white text-[10px] py-1 rounded">Set</button>
                            </div>
                        </div>
                    </div>

                    <input type="text" id="pj" placeholder="Nama PIC" required class="w-full p-3 bg-gray-100 rounded-xl text-sm font-semibold uppercase">
                    
                    <button type="submit" id="btnSubmit" class="w-full bg-blue-700 text-white font-black py-4 rounded-xl hover:bg-blue-800 transition active:scale-95 uppercase text-xs tracking-widest">
                        Ajukan Booking Sekarang
                    </button>
                </div>
            </form>
        </div>
    </section>

    <!-- Calendar View -->
    <section class="container mx-auto px-6 py-10">
        <div id="calendarMain" class="bg-white p-6 rounded-3xl shadow-lg"></div>
    </section>
</div>

<script>
// --- KONFIGURASI FIREBASE ---
const firebaseConfig = {
    databaseURL: "https://databasebooking-cfa37-default-rtdb.asia-southeast1.firebasedatabase.app/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentRole = 'guest';
let selectedDate = "";
let viewDate = new Date();
let allBookings = [];

// --- UTILITY: KONVERSI JAM KE MENIT ---
function timeToMinutes(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return (h * 60) + m;
}

// --- LOGIKA UTAMA: CEK TABRAKAN & SIMPAN ---
async function simpanKeFirebase(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnSubmit');
    const tgl = document.getElementById('tanggal').value;
    const jMulai = document.getElementById('jamMulai').value;
    const jSelesai = document.getElementById('jamSelesai').value;
    const ruang = document.getElementById('ruangan').value;

    if (!tgl || !jMulai || !jSelesai) {
        return Swal.fire('Gagal', 'Pilih tanggal dan jam dengan benar!', 'error');
    }

    const startBaru = timeToMinutes(jMulai);
    const endBaru = timeToMinutes(jSelesai);

    if (startBaru >= endBaru) {
        return Swal.fire('Gagal', 'Jam selesai harus lebih besar dari jam mulai!', 'error');
    }

    // Disable tombol agar tidak double click
    btn.disabled = true;
    btn.innerText = "MENGECEK JADWAL...";

    try {
        // AMBIL DATA TERBARU DARI FIREBASE (BUKAN DARI VARIABEL LOKAL)
        const snapshot = await db.ref('bookings').once('value');
        let bentrok = false;
        let dataBentrok = null;

        snapshot.forEach(child => {
            const b = child.val();
            // Hanya cek yang tanggalnya sama, ruangannya sama, dan statusnya BUKAN Rejected
            if (b.tanggal === tgl && b.ruangan === ruang && b.status !== 'Rejected') {
                const [bMulaiStr, bSelesaiStr] = b.jam.split(' - ');
                const startLama = timeToMinutes(bMulaiStr);
                const endLama = timeToMinutes(bSelesaiStr);

                // Rumus Irisan Waktu: (StartA < EndB) AND (EndA > StartB)
                if (startBaru < endLama && endBaru > startLama) {
                    bentrok = true;
                    dataBentrok = b;
                }
            }
        });

        if (bentrok) {
            Swal.fire({
                icon: 'error',
                title: 'JADWAL TABRAKAN!',
                html: `Ruangan <b>${ruang}</b> sudah dipesan pada jam tersebut.<br><br>
                       <div class="text-left text-xs bg-red-50 p-4 rounded-lg border border-red-200">
                        <b>Kegiatan:</b> ${dataBentrok.kegiatan}<br>
                        <b>Bidang:</b> ${dataBentrok.bidang}<br>
                        <b>Waktu:</b> ${dataBentrok.jam}<br>
                        <b>Status:</b> ${dataBentrok.status}
                       </div>`,
            });
            btn.disabled = false;
            btn.innerText = "AJUKAN BOOKING SEKARANG";
        } else {
            // JIKA AMAN, SIMPAN KE FIREBASE
            const newId = Date.now().toString();
            await db.ref('bookings/' + newId).set({
                id: newId,
                tanggal: tgl,
                jam: `${jMulai} - ${jSelesai}`,
                ruangan: ruang,
                kegiatan: document.getElementById('kegiatan').value,
                bidang: document.getElementById('bidang').value,
                pj: document.getElementById('pj').value,
                status: 'Pending'
            });

            Swal.fire('Berhasil!', 'Permohonan Anda telah terkirim.', 'success');
            document.getElementById('bookingForm').reset();
            selectedDate = "";
            renderMiniCalendar();
            btn.disabled = false;
            btn.innerText = "AJUKAN BOOKING SEKARANG";
        }
    } catch (err) {
        console.error(err);
        Swal.fire('Error', 'Terjadi masalah koneksi.', 'error');
        btn.disabled = false;
        btn.innerText = "AJUKAN BOOKING SEKARANG";
    }
}

// --- INISIALISASI ---
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    if (role === 'adalahuser') {
        currentRole = 'user';
        document.getElementById('userFormSection').classList.remove('hidden');
        document.getElementById('roleLabel').innerText = "AKSES: USER";
    } else if (role === 'adalahadmin') {
        currentRole = 'admin';
        document.getElementById('roleLabel').innerText = "AKSES: ADMIN";
    }
    
    initTimePickers();
    renderMiniCalendar();
    tarikData();
};

function tarikData() {
    db.ref('bookings').on('value', (snapshot) => {
        allBookings = [];
        snapshot.forEach(c => allBookings.push(c.val()));
        renderMainCalendar();
    });
}

function renderMainCalendar() {
    const el = document.getElementById('calendarMain');
    const calendar = new FullCalendar.Calendar(el, {
        initialView: 'dayGridMonth',
        locale: 'id',
        events: allBookings.map(b => ({
            title: `[${b.ruangan}] ${b.kegiatan}`,
            start: b.tanggal,
            backgroundColor: b.status === 'Approved' ? '#16a34a' : b.status === 'Rejected' ? '#dc2626' : '#eab308',
            borderColor: 'transparent'
        }))
    });
    calendar.render();
}

// --- MINI CALENDAR LOGIC ---
function renderMiniCalendar() {
    const grid = document.getElementById('miniCalendar');
    const label = document.getElementById('monthName');
    grid.innerHTML = '';
    
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    label.innerText = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(viewDate);
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    const startOffset = firstDay === 0 ? 6 : firstDay - 1;
    for(let i=0; i<startOffset; i++) grid.innerHTML += '<div></div>';
    
    for(let d=1; d<=daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const div = document.createElement('div');
        div.className = `calendar-day ${selectedDate === dateStr ? 'selected' : ''}`;
        div.innerText = d;
        div.onclick = () => {
            selectedDate = dateStr;
            document.getElementById('tanggal').value = dateStr;
            renderMiniCalendar();
        };
        grid.appendChild(div);
    }
}
function changeMonth(step) { viewDate.setMonth(viewDate.getMonth() + step); renderMiniCalendar(); }

// --- TIME PICKER LOGIC ---
function initTimePickers() {
    const hM = document.getElementById('hMulai');
    const mM = document.getElementById('mMulai');
    const hS = document.getElementById('hSelesai');
    const mS = document.getElementById('mSelesai');
    
    for(let i=7; i<=18; i++) {
        const h = String(i).padStart(2, '0');
        hM.innerHTML += `<div class="time-unit" onclick="setTime('jamMulai','H','${h}',this)">${h}</div>`;
        hS.innerHTML += `<div class="time-unit" onclick="setTime('jamSelesai','H','${h}',this)">${h}</div>`;
    }
    ['00','15','30','45'].forEach(m => {
        mM.innerHTML += `<div class="time-unit" onclick="setTime('jamMulai','M','${m}',this)">${m}</div>`;
        mS.innerHTML += `<div class="time-unit" onclick="setTime('jamSelesai','M','${m}',this)">${m}</div>`;
    });
}

let tempTime = { jamMulai: {H:'08', M:'00'}, jamSelesai: {H:'09', M:'00'} };

function setTime(id, type, val, el) {
    tempTime[id][type] = val;
    el.parentElement.querySelectorAll('.time-unit').forEach(u => u.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(id).value = `${tempTime[id].H}:${tempTime[id].M}`;
}

function togglePicker(id) {
    const p = document.getElementById(id);
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
}
</script>

</body>
</html>
