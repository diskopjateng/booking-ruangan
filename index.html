<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Booking Ruang - Dinas Koperasi & UKM Jateng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bg-jateng { background-color: #1e3a8a; }
        .fc { background: white; border-radius: 2rem; padding: 20px; border: none !important; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .dark .fc { background: #1e293b; color: white; border: 1px solid #334155 !important; }
        .calendar-day { transition: all 0.2s; cursor: pointer; height: 35px; width: 35px; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 10px; }
        .calendar-day.selected { background-color: #1e3a8a !important; color: white !important; }
        .time-picker-overlay { display: none; position: absolute; bottom: 100%; left: 0; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; z-index: 999; padding: 1rem; }
        .dark .time-picker-overlay { background: #1e293b; border-color: #334155; }
        .time-column { height: 120px; overflow-y: auto; scrollbar-width: none; }
        .time-unit { padding: 0.5rem; text-align: center; cursor: pointer; border-radius: 0.5rem; font-weight: bold; font-size: 14px; }
        .time-unit.active { background: #1e3a8a; color: white; }
        #btnDownload { display: none; } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-gray-100">

    <nav class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-[100] border-b-4 border-yellow-500">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Coat_of_arms_of_Central_Java.svg/960px-Coat_of_arms_of_Central_Java.svg.png" class="h-10">
                <div>
                    <h1 class="font-black text-blue-900 dark:text-blue-400 text-xs leading-none">DISKOP UKM</h1>
                    <p class="text-[9px] font-bold text-gray-400 uppercase italic">Provinsi Jawa Tengah</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-slate-700 text-gray-500 dark:text-yellow-400 flex items-center justify-center">
                    <i id="themeIcon" class="fas fa-moon"></i>
                </button>
                <span id="roleLabel" class="text-[10px] font-black bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-4 py-2 rounded-full border border-blue-100 dark:border-blue-800 uppercase italic">GUEST</span>
            </div>
        </div>
    </nav>

    <header class="bg-jateng text-white py-16 px-6 text-center">
        <h2 class="text-3xl md:text-4xl font-black uppercase mb-2 tracking-tighter">Monitoring & Reservasi</h2>
        <p class="opacity-80 text-sm font-light">Sistem Informasi Penggunaan Ruang Rapat</p>
    </header>

    <section id="userFormSection" class="container mx-auto px-6 -mt-10 hidden mb-12 relative z-50">
        <div class="max-w-5xl mx-auto bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-gray-100 dark:border-slate-700 overflow-hidden">
            <form id="bookingForm" onsubmit="simpanKeFirebase(event)" class="grid grid-cols-1 lg:grid-cols-3">
                <div class="p-6 lg:border-r border-gray-100 dark:border-slate-700">
                    <label class="text-[10px] font-black text-gray-400 uppercase mb-4 block">1. Klik Tanggal</label>
                    <div class="bg-gray-50 dark:bg-slate-900 p-4 rounded-2xl border">
                        <div class="flex justify-between items-center mb-4">
                            <button type="button" onclick="prevMonth()"><i class="fas fa-chevron-left text-xs"></i></button>
                            <h4 id="calendarMonth" class="font-black uppercase text-[10px]"></h4>
                            <button type="button" onclick="nextMonth()"><i class="fas fa-chevron-right text-xs"></i></button>
                        </div>
                        <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
                    </div>
                    <input type="hidden" id="tanggal" required>
                    <div id="selectedDateDisplay" class="mt-4 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-xl text-[10px] font-bold text-blue-700 dark:text-blue-300 text-center italic">Belum pilih tanggal</div>
                </div>

                <div class="lg:col-span-2 p-6 space-y-4">
                    <label class="text-[10px] font-black text-gray-400 uppercase block">2. Detail Kegiatan</label>
                    <input type="text" id="kegiatan" placeholder="Nama Kegiatan" required class="w-full p-3 bg-gray-50 dark:bg-slate-900 rounded-xl outline-none focus:ring-2 ring-blue-500 text-sm font-semibold">
                    <div class="grid grid-cols-2 gap-4">
                        <select id="ruangan" class="p-3 bg-gray-50 dark:bg-slate-900 rounded-xl font-bold text-xs uppercase">
                            <option>GATOTKACA</option><option>ARJUNA</option><option>ARIMBI</option><option>PODCAST</option>
                        </select>
                        <select id="bidang" class="p-3 bg-gray-50 dark:bg-slate-900 rounded-xl font-bold text-xs uppercase">
                            <option>UMPEG</option><option>PROGRAM</option><option>KEUANGAN</option><option>BINA USAHA KOPERASI</option><option>PENGEMBANGAN UKM</option><option>BALATKOP</option>
                        </select>
                        <div class="relative">
                            <input type="text" id="jamMulai" placeholder="Mulai" readonly onclick="toggleTimePicker('pickerMulai')" class="w-full p-3 bg-gray-50 dark:bg-slate-900 rounded-xl text-xs font-bold text-center cursor-pointer">
                            <div id="pickerMulai" class="time-picker-overlay">
                                <div class="flex justify-around"><div class="time-column" id="hoursMulai"></div><div class="time-column" id="minsMulai"></div></div>
                                <button type="button" onclick="closeTimePicker('pickerMulai')" class="w-full mt-3 bg-blue-900 text-white py-2 rounded-xl text-[10px] font-bold uppercase">Set</button>
                            </div>
                        </div>
                        <div class="relative">
                            <input type="text" id="jamSelesai" placeholder="Selesai" readonly onclick="toggleTimePicker('pickerSelesai')" class="w-full p-3 bg-gray-50 dark:bg-slate-900 rounded-xl text-xs font-bold text-center cursor-pointer">
                            <div id="pickerSelesai" class="time-picker-overlay">
                                <div class="flex justify-around"><div class="time-column" id="hoursSelesai"></div><div class="time-column" id="minsSelesai"></div></div>
                                <button type="button" onclick="closeTimePicker('pickerSelesai')" class="w-full mt-3 bg-blue-900 text-white py-2 rounded-xl text-[10px] font-bold uppercase">Set</button>
                            </div>
                        </div>
                    </div>
                    <input type="text" id="pj" placeholder="PIC Penanggung Jawab" required class="w-full p-3 bg-gray-50 dark:bg-slate-900 rounded-xl text-sm font-bold uppercase">
                    <button type="submit" class="w-full bg-blue-700 text-white font-black py-4 rounded-xl hover:bg-blue-800 uppercase text-xs shadow-lg transition active:scale-95">Ajukan Reservasi</button>
                </div>
            </form>
        </div>
    </section>

    <section class="container mx-auto px-6 py-12">
        <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
            <h3 class="font-900 text-2xl text-blue-900 dark:text-white uppercase italic tracking-tighter">Jadwal Kalender</h3>
            <div class="flex gap-2 w-full md:w-auto">
                <button id="btnDownload" onclick="downloadRekapan()" class="text-[10px] font-black px-4 py-3 bg-green-600 text-white shadow-sm rounded-xl border-b-4 border-green-800 uppercase hover:bg-green-700 transition active:scale-95">
                    <i class="fas fa-file-excel mr-2"></i> Unduh Rekap
                </button>
                <select id="filterRuangan" onchange="renderCalendar()" class="text-[10px] font-black px-4 py-3 bg-white dark:bg-slate-800 shadow-sm rounded-xl border-b-4 border-yellow-500 uppercase">
                    <option value="Semua">Semua Ruangan</option>
                    <option>GATOTKACA</option><option>ARJUNA</option><option>ARIMBI</option><option>PODCAST</option>
                </select>
            </div>
        </div>
        <div id="calendarMain"></div>
        <div id="loader" class="p-20 text-center font-black text-gray-400 animate-pulse uppercase text-[10px]">Menyinkronkan Data...</div>
    </section>

    <script>
        const firebaseConfig = { databaseURL: "https://e-booking-eed92-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allBookings = [];
        let currentRole = 'guest'; 
        let calendar;
        let currentFormDate = new Date();
        let selectedDateStr = "";
        let tempTime = { jamMulai: {H:'08', M:'00'}, jamSelesai: {H:'10', M:'00'} };

        window.onload = () => { detectRole(); initTheme(); tarikDataFirebase(); };

        function detectRole() {
            const params = new URLSearchParams(window.location.search);
            const role = params.get('role');
            currentRole = 'guest';
            document.getElementById('btnDownload').style.display = 'none';
            document.getElementById('userFormSection').classList.add('hidden');
            if (role === 'adalahadmin') {
                currentRole = 'admin';
                document.getElementById('btnDownload').style.display = 'block';
            } else if (role === 'adalahuser') {
                currentRole = 'user';
                document.getElementById('userFormSection').classList.remove('hidden');
                generateTimeOptions('hoursMulai', 'minsMulai', 'jamMulai');
                generateTimeOptions('hoursSelesai', 'minsSelesai', 'jamSelesai');
                initFormCalendar();
            }
            document.getElementById('roleLabel').innerText = "AKSES: " + currentRole.toUpperCase();
        }

        function tarikDataFirebase() {
            db.ref('bookings').on('value', (snap) => {
                allBookings = [];
                snap.forEach(child => { allBookings.push(child.val()); });
                renderCalendar();
            });
        }

        // --- FUNGSI PROTEKSI TABRAKAN JADWAL ---
        function simpanKeFirebase(e) {
            e.preventDefault();
            const tgl = document.getElementById('tanggal').value;
            const ruang = document.getElementById('ruangan').value;
            const mulai = document.getElementById('jamMulai').value;
            const selesai = document.getElementById('jamSelesai').value;

            if(!tgl || !mulai || !selesai) return Swal.fire('Error', 'Lengkapi tanggal dan jam!', 'warning');

            // Konversi jam ke angka (menit) untuk perbandingan
            const toMinutes = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
            const mBaru = toMinutes(mulai);
            const sBaru = toMinutes(selesai);

            if(sBaru <= mBaru) return Swal.fire('Jam Salah', 'Jam selesai harus setelah jam mulai!', 'error');

            // Cek Tabrakan: Cari booking di tanggal & ruangan yang sama
            const isTabrakan = allBookings.some(b => {
                if (b.tanggal === tgl && b.ruangan === ruang && b.status !== 'Rejected') {
                    const [bMulaiStr, bSelesaiStr] = b.jam.split(' - ');
                    const bMulai = toMinutes(bMulaiStr);
                    const bSelesai = toMinutes(bSelesaiStr);
                    // Logika Irisan Waktu: (Mulai1 < Selesai2) DAN (Selesai1 > Mulai2)
                    return (mBaru < bSelesai && sBaru > bMulai);
                }
                return false;
            });

            if (isTabrakan) {
                return Swal.fire({
                    icon: 'error',
                    title: 'Jadwal Bentrok!',
                    text: `Ruang ${ruang} sudah dibooking pada jam tersebut. Silakan pilih jam atau ruangan lain.`,
                    confirmButtonColor: '#1e3a8a'
                });
            }

            // Jika aman, simpan ke Firebase
            const id = Date.now().toString();
            db.ref('bookings/' + id).set({
                id: id, tanggal: tgl, jam: `${mulai} - ${selesai}`,
                ruangan: ruang, kegiatan: document.getElementById('kegiatan').value,
                bidang: document.getElementById('bidang').value, pj: document.getElementById('pj').value, status: 'Pending'
            }).then(() => {
                Swal.fire('Berhasil!', 'Reservasi terkirim dan sedang menunggu verifikasi.', 'success');
                document.getElementById('bookingForm').reset();
                selectedDateStr = ""; initFormCalendar();
            });
        }

        // --- SISA KODE (Calendar, Timepicker, UI) ---
        function renderCalendar() {
            const calendarEl = document.getElementById('calendarMain');
            const filter = document.getElementById('filterRuangan').value;
            const data = (filter === 'Semua') ? allBookings : allBookings.filter(b => b.ruangan === filter);
            const events = data.map(b => ({
                id: b.id, title: `[${b.ruangan}] ${b.kegiatan}`, start: b.tanggal,
                backgroundColor: b.status === 'Approved' ? '#22c55e' : (b.status === 'Rejected' ? '#ef4444' : '#facc15'),
                extendedProps: { ...b }
            }));
            if (calendar) calendar.destroy();
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth', locale: 'id', events: events,
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                eventClick: (info) => showBookingDetail(info.event.extendedProps)
            });
            calendar.render();
            document.getElementById('loader').style.display = 'none';
        }

        function showBookingDetail(p) {
            Swal.fire({
                title: `<p class="text-sm font-black uppercase">${p.kegiatan}</p>`,
                html: `<div class="text-left text-xs space-y-2 p-4 bg-gray-50 dark:bg-slate-900 rounded-2xl">
                    <p><strong>Ruang:</strong> ${p.ruangan}</p>
                    <p><strong>Waktu:</strong> ${p.jam}</p>
                    <p><strong>Bidang:</strong> ${p.bidang}</p>
                    <p><strong>PIC:</strong> ${p.pj}</p>
                    <p><strong>Status:</strong> ${p.status}</p>
                </div>
                ${currentRole === 'admin' ? `
                    <div class="grid grid-cols-2 gap-2 mt-4">
                        <button onclick="updateStatus('${p.id}', 'Approved')" class="bg-green-600 text-white py-2 rounded-lg text-[10px] font-black uppercase">Approve</button>
                        <button onclick="updateStatus('${p.id}', 'Rejected')" class="bg-red-600 text-white py-2 rounded-lg text-[10px] font-black uppercase">Reject</button>
                    </div>` : ''}`,
                showConfirmButton: false, customClass: { popup: 'rounded-[2rem] dark:bg-slate-800 dark:text-white' }
            });
        }

        function updateStatus(id, newStatus) { db.ref('bookings/' + id).update({ status: newStatus }).then(() => Swal.close()); }

        function downloadRekapan() {
            if (currentRole !== 'admin') return;
            const date = calendar.getDate();
            const month = date.getMonth(), year = date.getFullYear();
            const filtered = allBookings.filter(b => { const d = new Date(b.tanggal); return d.getMonth() === month && d.getFullYear() === year; });
            if (filtered.length === 0) return Swal.fire('Info', 'Tidak ada data', 'info');
            const ws = XLSX.utils.json_to_sheet(filtered.map((b, i) => ({ "No": i + 1, "Tanggal": b.tanggal, "Waktu": b.jam, "Ruang": b.ruangan, "Kegiatan": b.kegiatan, "Status": b.status })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap");
            XLSX.writeFile(wb, `REKAP_${month+1}_${year}.xlsx`);
        }

        function generateTimeOptions(tH, tM, id) {
            const hD = document.getElementById(tH), mD = document.getElementById(tM);
            for(let i=7; i<=18; i++) { const v = String(i).padStart(2, '0'); hD.innerHTML += `<div class="time-unit h-unit-${id}" onclick="setTimePart('${id}', 'H', '${v}', this)">${v}</div>`; }
            ['00','15','30','45'].forEach(v => { mD.innerHTML += `<div class="time-unit m-unit-${id}" onclick="setTimePart('${id}', 'M', '${v}', this)">${v}</div>`; });
        }
        function setTimePart(id, t, v, el) {
            tempTime[id][t] = v;
            document.querySelectorAll(`.h-unit-${id}, .m-unit-${id}`).forEach(u => { if((t==='H' && u.classList.contains(`h-unit-${id}`)) || (t==='M' && u.classList.contains(`m-unit-${id}`))) u.classList.remove('active'); });
            el.classList.add('active'); document.getElementById(id).value = `${tempTime[id].H}:${tempTime[id].M}`;
        }
        function toggleTimePicker(id) { const el = document.getElementById(id); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
        function closeTimePicker(id) { document.getElementById(id).style.display = 'none'; }
        function initFormCalendar() {
            const grid = document.getElementById('calendarGrid'), label = document.getElementById('calendarMonth');
            grid.innerHTML = '';
            const y = currentFormDate.getFullYear(), m = currentFormDate.getMonth();
            label.innerText = `${new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(currentFormDate)} ${y}`;
            const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
            let offset = first === 0 ? 6 : first - 1;
            ['S','S','R','K','J','S','M'].forEach(h => grid.innerHTML += `<div class="text-[8px] font-black text-gray-300 text-center">${h}</div>`);
            for (let i = 0; i < offset; i++) grid.innerHTML += `<div></div>`;
            for (let d = 1; d <= days; d++) {
                const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                grid.innerHTML += `<div onclick="selectDate('${ds}')" class="calendar-day ${selectedDateStr === ds ? 'selected' : ''}">${d}</div>`;
            }
        }
        function selectDate(d) { selectedDateStr = d; document.getElementById('tanggal').value = d; document.getElementById('selectedDateDisplay').innerText = new Date(d).toLocaleDateString('id-ID', { dateStyle: 'full' }); initFormCalendar(); }
        function prevMonth() { currentFormDate.setMonth(currentFormDate.getMonth() - 1); initFormCalendar(); }
        function nextMonth() { currentFormDate.setMonth(currentFormDate.getMonth() + 1); initFormCalendar(); }
        function toggleDarkMode() { localStorage.setItem('theme', document.documentElement.classList.toggle('dark') ? 'dark' : 'light'); if(calendar) renderCalendar(); }
        function initTheme() { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); }
    </script>
</body>
</html>
