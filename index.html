<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Booking Ruang - Dinas Koperasi & UKM Jateng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s; }
        .bg-jateng { background-color: #1e3a8a; }
        .fc { background: white; border-radius: 2rem; padding: 20px; border: none !important; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .dark .fc { background: #1e293b; color: white; border: 1px solid #334155 !important; }
        .fc-event { cursor: pointer; border: none; padding: 4px 8px; font-size: 10px; font-weight: 800; border-radius: 6px; margin: 1px 0; text-transform: uppercase; }
        .fc-toolbar-title { font-weight: 900 !important; text-transform: uppercase; font-size: 1.1rem !important; color: #1e3a8a; }
        .dark .fc-toolbar-title { color: #facc15; }
        .fc-button-primary { background-color: #1e3a8a !important; border: none !important; font-size: 11px !important; font-weight: 800 !important; text-transform: uppercase; border-radius: 10px !important; }
        .calendar-day { transition: all 0.2s; cursor: pointer; height: 35px; width: 35px; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 10px; }
        .calendar-day.selected { background-color: #1e3a8a !important; color: white !important; }
        .calendar-day.booked { background-color: #ef4444 !important; color: white !important; cursor: not-allowed !important; }
        .time-picker-overlay { display: none; position: absolute; bottom: 100%; left: 0; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; z-index: 999; padding: 1rem; }
        .dark .time-picker-overlay { background: #1e293b; border-color: #334155; }
        .time-column { height: 120px; overflow-y: auto; scrollbar-width: none; }
        .time-unit { padding: 0.5rem; text-align: center; cursor: pointer; border-radius: 0.5rem; font-weight: bold; font-size: 14px; }
        .time-unit.active { background: #1e3a8a; color: white; }
        .time-unit.booked { background: #ef4444; color: white; cursor: not-allowed !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-gray-100">

<!-- HTML sama persis seperti sebelumnya, hanya tambah script -->

<script>
// Konfigurasi Database Anda
const firebaseConfig = {
    databaseURL: "https://databasebooking-cfa37-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allBookings = [];
let currentRole = 'guest';
let calendar;
let currentFormDate = new Date();
let selectedDateStr = "";
let tempTime = {
    jamMulai: { H:'08', M:'00' },
    jamSelesai: { H:'10', M:'00' }
};

window.onload = () => {
    detectRole();
    initTheme();
    if (currentRole === 'user') {
        generateTimeOptions('hoursMulai', 'minsMulai', 'jamMulai');
        generateTimeOptions('hoursSelesai', 'minsSelesai', 'jamSelesai');
        initFormCalendar();
    }
    tarikDataFirebase();
};

function detectRole() {
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    if (role === 'adalahadmin') {
        currentRole = 'admin';
        document.getElementById('downloadBtn').classList.remove('hidden');
    } else if (role === 'adalahuser') {
        currentRole = 'user';
        document.getElementById('userFormSection').classList.remove('hidden');
    }
    document.getElementById('roleLabel').innerText = "AKSES: " + currentRole.toUpperCase();
}

function tarikDataFirebase() {
    db.ref('bookings').on('value', (snap) => {
        allBookings = [];
        snap.forEach(child => {
            allBookings.push(child.val());
        });
        renderCalendar();
        if (currentRole === 'user') {
            checkBookedSlots();
        }
    });
}

// **FUNGSI BARU: CEK TABRAKAN PESANAN**
function isTimeOverlap(start1, end1, start2, end2) {
    // Parse waktu ke menit
    const toMinutes = (time) => {
        const [h, m] = time.split(':').map(Number);
        return h * 60 + m;
    };
    
    const start1Min = toMinutes(start1);
    const end1Min = toMinutes(end1);
    const start2Min = toMinutes(start2);
    const end2Min = toMinutes(end2);
    
    // Ada tabrakan jika:
    // start1 < end2 DAN start2 < end1
    return start1Min < end2Min && start2Min < end1Min;
}

function checkBookedSlots() {
    const tgl = document.getElementById('tanggal').value;
    const ruangan = document.getElementById('ruangan').value;
    const jamMulai = document.getElementById('jamMulai').value;
    const jamSelesai = document.getElementById('jamSelesai').value;
    
    if (!tgl || !ruangan || !jamMulai || !jamSelesai) return;
    
    // Cari booking yang sama tanggal dan ruangan (Pending & Approved)
    const conflicts = allBookings.filter(b => 
        b.tanggal === tgl && 
        b.ruangan === ruangan && 
        (b.status === 'Pending' || b.status === 'Approved') &&
        isTimeOverlap(jamMulai, jamSelesai, b.jam.split(' - ')[0], b.jam.split(' - ')[1])
    );
    
    // Update visual booked slots
    updateBookedVisual(conflicts, tgl, ruangan);
    
    return conflicts;
}

function updateBookedVisual(conflicts, tgl, ruangan) {
    // Reset semua
    document.querySelectorAll('.time-unit').forEach(el => {
        el.classList.remove('booked');
    });
    document.querySelectorAll('.calendar-day').forEach(el => {
        el.classList.remove('booked');
    });
    
    // Mark conflicted times as booked
    conflicts.forEach(booking => {
        const [start, end] = booking.jam.split(' - ');
        const [startH, startM] = start.split(':');
        const [endH, endM] = end.split(':');
        
        // Mark hours
        [startH, endH].forEach(h => {
            const bookedHour = document.querySelector(`[onclick="setTimePart('jamMulai','H','${h}',this)"]`) ||
                              document.querySelector(`[onclick="setTimePart('jamSelesai','H','${h}',this)"]`);
            if (bookedHour) bookedHour.classList.add('booked');
        });
        
        // Mark minutes
        [startM, endM].forEach(m => {
            const bookedMin = document.querySelector(`[onclick*="M,'${m}'"]`);
            if (bookedMin) bookedMin.classList.add('booked');
        });
    });
    
    // Mark date as booked if any conflict
    if (conflicts.length > 0) {
        const dateCell = Array.from(document.querySelectorAll('.calendar-day')).find(el => 
            el.textContent.trim() && el.onclick.toString().includes(tgl)
        );
        if (dateCell) dateCell.classList.add('booked');
    }
}

function renderCalendar() {
    const calendarEl = document.getElementById('calendarMain');
    const filter = document.getElementById('filterRuangan').value;
    const data = (filter === 'Semua') ? allBookings : allBookings.filter(b => b.ruangan === filter);
    const events = data.map(b => ({
        id: b.id,
        title: `[${b.ruangan}] ${b.kegiatan}`,
        start: b.tanggal,
        backgroundColor: b.status === 'Approved' ? '#22c55e' : b.status === 'Rejected' ? '#ef4444' : '#facc15',
        extendedProps: { ...b }
    }));
    if (calendar) calendar.destroy();
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'id',
        events: events,
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
        eventClick: (info) => showBookingDetail(info.event.extendedProps)
    });
    calendar.render();
    document.getElementById('loader').style.display = 'none';
}

function showBookingDetail(p) {
    let adminButtons = "";
    if (currentRole === 'admin') {
        adminButtons = `
            <div class="grid grid-cols-3 gap-2 mt-6 pt-4 border-t border-gray-200 dark:border-slate-700">
                <button onclick="prosesAdmin('${p.id}', 'Approved')" class="bg-green-600 hover:bg-green-700 text-white text-[10px] font-black py-3 rounded-xl uppercase transition shadow-md">Terima</button>
                <button onclick="prosesAdmin('${p.id}', 'Rejected')" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-black py-3 rounded-xl uppercase transition shadow-md">Tolak</button>
                <button onclick="hapusAdmin('${p.id}')" class="bg-slate-800 hover:bg-black text-white text-[10px] font-black py-3 rounded-xl uppercase transition shadow-md">Hapus</button>
            </div>
        `;
    }

    Swal.fire({
        title: `<div class="text-blue-900 dark:text-blue-400 font-black text-sm uppercase italic">${p.kegiatan}</div>`,
        html: `
            <div class="text-left text-[11px] space-y-3 p-4 bg-gray-50 dark:bg-slate-900 rounded-2xl border border-gray-100 dark:border-slate-700">
                <p><strong><i class="fas fa-door-open mr-2"></i>Ruangan:</strong> ${p.ruangan}</p>
                <p><strong><i class="fas fa-clock mr-2"></i>Waktu:</strong> ${p.jam}</p>
                <p><strong><i class="fas fa-building mr-2"></i>Bidang:</strong> ${p.bidang}</p>
                <p><strong><i class="fas fa-user mr-2"></i>PIC:</strong> ${p.pj}</p>
                <p><strong><i class="fas fa-info-circle mr-2"></i>Status:</strong> 
                   <span class="px-2 py-1 rounded-md font-bold ${p.status === 'Approved' ? 'bg-green-100 text-green-700' : p.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}">${p.status}</span>
                </p>
            </div>
            ${adminButtons}
        `,
        showConfirmButton: false,
        showCloseButton: true,
        background: document.documentElement.classList.contains('dark') ? '#1e293b' : '#fff',
        color: document.documentElement.classList.contains('dark') ? '#fff' : '#000'
    });
}

// **FUNGSI MODIFIKASI: VALIDASI SEBELUM SIMPAN**
async function simpanKeFirebase(e) {
    e.preventDefault();
    
    const tgl = document.getElementById('tanggal').value;
    const ruangan = document.getElementById('ruangan').value;
    const jamMulai = document.getElementById('jamMulai').value;
    const jamSelesai = document.getElementById('jamSelesai').value;
    const kegiatan = document.getElementById('kegiatan').value;
    const pj = document.getElementById('pj').value;
    
    if (!tgl || !ruangan || !jamMulai || !jamSelesai || !kegiatan || !pj) {
        return Swal.fire('Error', 'Lengkapi semua data!', 'warning');
    }
    
    // **CEK TABRAKAN DENGAN BOOKING PENDING & APPROVED**
    const conflicts = allBookings.filter(b => 
        b.tanggal === tgl && 
        b.ruangan === ruangan && 
        (b.status === 'Pending' || b.status === 'Approved') &&
        isTimeOverlap(jamMulai, jamSelesai, b.jam.split(' - ')[0], b.jam.split(' - ')[1])
    );
    
    if (conflicts.length > 0) {
        const conflictDetails = conflicts.map(c => 
            `<div class="mt-2 p-2 bg-red-50 dark:bg-red-900/30 rounded-lg border-l-4 border-red-400">
                <p class="font-bold text-sm">${c.kegiatan}</p>
                <p class="text-xs text-red-700 dark:text-red-300">${c.jam} - ${c.pj} (${c.bidang})</p>
                <p class="text-xs text-red-600 dark:text-red-400">${new Date(c.id).toLocaleString('id-ID')}</p>
            </div>`
        ).join('');
        
        Swal.fire({
            icon: 'error',
            title: '❌ Tabrakan Jadwal!',
            html: `
                <div class="text-left">
                    <p class="mb-4">Ruangan <strong>${ruangan}</strong> pada <strong>${new Date(tgl).toLocaleDateString('id-ID', {dateStyle: 'full'})}</strong> sudah dipesan:</p>
                    ${conflictDetails}
                    <p class="mt-4 text-sm font-bold text-red-600 dark:text-red-400">Silakan pilih waktu atau ruangan lain!</p>
                </div>
            `,
            confirmButtonColor: '#ef4444'
        });
        return;
    }
    
    // Lanjut simpan jika tidak ada tabrakan
    const id = Date.now().toString();
    await db.ref('bookings/' + id).set({
        id: id,
        tanggal: tgl,
        jam: jamMulai + ' - ' + jamSelesai,
        ruangan: ruangan,
        kegiatan: kegiatan,
        bidang: document.getElementById('bidang').value,
        pj: pj,
        status: 'Pending',
        createdAt: new Date().toISOString()
    });
    
    Swal.fire({
        icon: 'success',
        title: '✅ Reservasi Berhasil!',
        text: 'Menunggu persetujuan admin',
        timer: 2000
    });
    
    document.getElementById('bookingForm').reset();
    selectedDateStr = "";
    document.getElementById('selectedDateDisplay').innerText = 'Belum pilih tanggal';
    initFormCalendar();
    checkBookedSlots();
}

// **EVENT LISTENER UNTUK REAL-TIME VALIDASI**
document.getElementById('ruangan').addEventListener('change', checkBookedSlots);
document.getElementById('tanggal').addEventListener('change', checkBookedSlots);

// Update check saat pilih waktu
window.setTimePart = function(inputId, type, val, el) {
    if (el.classList.contains('booked')) {
        Swal.fire('Waktu sudah dipesan!', 'Pilih waktu lain', 'warning');
        return;
    }
    
    const container = el.parentElement;
    container.querySelectorAll('.time-unit').forEach(u => u.classList.remove('active'));
    tempTime[inputId][type] = val;
    el.classList.add('active');
    document.getElementById(inputId).value = `${tempTime[inputId].H}:${tempTime[inputId].M}`;
    
    // Re-check conflicts setelah pilih waktu
    setTimeout(checkBookedSlots, 100);
};

// Fungsi admin sama persis
function prosesAdmin(id, status) {
    db.ref('bookings/' + id).update({ status: status })
    .then(() => {
        Swal.fire({ icon: 'success', title: 'Berhasil', text: 'Status diperbarui ke ' + status, timer: 1500 });
    });
}

function hapusAdmin(id) {
    Swal.fire({
        title: 'Hapus Data?',
        text: "Data akan dihapus permanen!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Ya, Hapus'
    }).then((result) => {
        if (result.isConfirmed) {
            db.ref('bookings/' + id).remove().then(() => {
                Swal.fire('Terhapus!', 'Data berhasil dihapus.', 'success');
            });
        }
    });
}

window.prosesAdmin = prosesAdmin;
window.hapusAdmin = hapusAdmin;

// Fungsi lainnya sama persis (calendar form, theme, dll)
function initFormCalendar() {
    const grid = document.getElementById('calendarGrid');
    const monthLabel = document.getElementById('calendarMonth');
    const months = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    grid.innerHTML = '';
    const year = currentFormDate.getFullYear();
    const month = currentFormDate.getMonth();
    monthLabel.innerText = `${months[month]} ${year}`;
    const firstDay = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();
    let offset = firstDay === 0 ? 6 : firstDay - 1;
    ['S','S','R','K','J','S','M'].forEach(h => { grid.innerHTML += `<div class="text-[8px] font-black text-gray-300 text-center">${h}</div>`; });
    for (let i = 0; i < offset; i++) { grid.innerHTML += `<div class="calendar-day empty"></div>`; }
    for (let d = 1; d <= days; d++) {
        const ds = `${year}-${String(month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        grid.innerHTML += `<div onclick="selectDate('${ds}')" class="calendar-day ${selectedDateStr === ds ? 'selected' : ''}">${d}</div>`;
    }
    checkBookedSlots(); // Check booked dates
}

function selectDate(date) {
    if (event.target.classList.contains('booked')) {
        Swal.fire('Tanggal sudah penuh!', 'Pilih tanggal lain', 'warning');
        return;
    }
    
    selectedDateStr = date;
    document.getElementById('tanggal').value = date;
    document.getElementById('selectedDateDisplay').innerText = new Date(date).toLocaleDateString('id-ID', { dateStyle: 'full' });
    initFormCalendar();
}

function prevMonth() { currentFormDate.setMonth(currentFormDate.getMonth() - 1); initFormCalendar(); }
function nextMonth() { currentFormDate.setMonth(currentFormDate.getMonth() + 1); initFormCalendar(); }

function generateTimeOptions(targetHours, targetMins, inputId) {
    const hDiv = document.getElementById(targetHours);
    const mDiv = document.getElementById(targetMins);
    for (let i = 7; i <= 18; i++) {
        const val = String(i).padStart(2, '0');
        hDiv.innerHTML += `<div class="time-unit" onclick="setTimePart('${inputId}','H','${val}',this)">${val}</div>`;
    }
    ['00','15','30','45'].forEach(val => {
        mDiv.innerHTML += `<div class="time-unit" onclick="setTimePart('${inputId}','M','${val}',this)">${val}</div>`;
    });
}

function toggleTimePicker(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
    checkBookedSlots();
}

function closeTimePicker(id) { 
    document.getElementById(id).style.display = 'none'; 
}

function toggleDarkMode() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function initTheme() {
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
}

function downloadRekapan() {
    const currentViewDate = calendar.getDate();
    const currentMonth = currentViewDate.getMonth();
    const currentYear = currentViewDate.getFullYear();
    const monthNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const filteredData = allBookings.filter(b => {
        const d = new Date(b.tanggal);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
    }).sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

    const dataExcel = filteredData.map((b, index) => ({
        "No": index + 1, "Tanggal": b.tanggal, "Waktu": b.jam, "Ruangan": b.ruangan, "Kegiatan": b.kegiatan, "Bidang": b.bidang, "PIC": b.pj, "Status": b.status
    }));

    const worksheet = XLSX.utils.json_to_sheet(dataExcel);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap");
    XLSX.writeFile(workbook, `REKAP_${monthNames[currentMonth].toUpperCase()}.xlsx`);
}
</script>

</body>
</html>
